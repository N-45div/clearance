# Example: Clearance as a CI gate. Checks out a Go service, runs govulncheck through `npm run check`
# against a FalkorDB service container, uploads the OpenVEX file, and fails the job only when a
# vulnerable function is reachable from shipped code (exit 1). A failed scan fails it too (exit 2).
name: clearance check (example)

on:
  # Runs when this file changes, and on demand from the Actions tab.
  push:
    branches: [main]
    paths: [.github/workflows/check-example.yml, "src/**"]
  workflow_dispatch:
    inputs:
      repo:
        description: Go repository to check
        default: grafana/smtprelay
      ref:
        description: Commit to check
        default: 4821afa7c7791089ec6aa777c99007664e281175

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:6.0.2
        ports:
          - 6379:6379
    env:
      FALKORDB_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5
        with:
          path: clearance
      - uses: actions/checkout@v5
        with:
          repository: ${{ inputs.repo || 'grafana/smtprelay' }}
          ref: ${{ inputs.ref || '4821afa7c7791089ec6aa777c99007664e281175' }}
          path: target
      - uses: actions/setup-go@v6
        with:
          go-version-file: target/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: npm ci --omit=dev
        working-directory: clearance
      - name: clearance check
        working-directory: clearance
        run: |
          set -o pipefail
          npm run --silent check -- --run --dir ../target --sha "${{ inputs.ref || '4821afa7c7791089ec6aa777c99007664e281175' }}" --vex ../openvex.json 2>&1 | tee ../report.txt
      - name: summary
        if: always()
        run: |
          { echo '```'; cat report.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: openvex
          path: openvex.json
          if-no-files-found: warn
